name: CPU foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Only synthetic SafeTensors weights are tracked
        run: test "$(git ls-files '*.safetensors')" = "fixtures/tiny-qwen/model.safetensors"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --features tesslot-backend-probe/burn-cpu --locked -- -D warnings
      - run: cargo test --workspace --features tesslot-backend-probe/burn-cpu --locked
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: cargo run --locked -- demo
      - run: cargo run --locked -- validate fixtures/canonical.jsonl --tokenizer fixtures/tokenizer-identity.json
