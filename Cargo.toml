[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/TheDudeFromCI/tesslot"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
tesslot-core = { path = "crates/tesslot-core" }
tesslot-dataset = { path = "crates/tesslot-dataset" }
tesslot-model = { path = "crates/tesslot-model" }
tesslot-api = { path = "crates/tesslot-api" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"

# Keep CPU/CUDA dependency builds usable on constrained development volumes.
[profile.dev]
debug = 0
[profile.test]
debug = 0
